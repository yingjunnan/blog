  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <g opacity="0.22">
    <path d="M0 48H1600M0 96H1600M0 144H1600M0 192H1600M0 240H1600M0 288H1600M0 336H1600M0 384H1600M0 432H1600M0 480H1600M0 528H1600M0 576H1600M0 624H1600M0 672H1600M0 720H1600M0 768H1600M0 816H1600" stroke="#334155" stroke-width="1"/>
    <path d="M48 0V900M96 0V900M144 0V900M192 0V900M240 0V900M288 0V900M336 0V900M384 0V900M432 0V900M480 0V900M528 0V900M576 0V900M624 0V900M672 0V900M720 0V900M768 0V900M816 0V900M864 0V900M912 0V900M960 0V900M1008 0V900M1056 0V900M1104 0V900M1152 0V900M1200 0V900M1248 0V900M1296 0V900M1344 0V900M1392 0V900M1440 0V900M1488 0V900M1536 0V900" stroke="#334155" stroke-width="1"/>
  </g>

  <g filter="url(#shadow)">
    <text x="88" y="164" class="subtitle" fill="#67E8F9">Kubernetes · Gateway API · HTTPRoute</text>
    <text x="88" y="255" class="cnTitle" fill="#F8FAFC">服务暴露与 HTTPS</text>
    <text x="88" y="326" class="title" fill="#38BDF8">TLS</text>
