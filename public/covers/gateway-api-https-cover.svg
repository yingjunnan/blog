      <path d="M1 1L13 7L1 13" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowViolet" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Menlo', 'Consolas', monospace; }
      .title { font: 800 74px 'JetBrains Mono', 'SFMono-Regular', 'Menlo', monospace; letter-spacing: -1.8px; }
      .cnTitle { font: 700 64px 'PingFang SC', 'Microsoft YaHei', sans-serif; letter-spacing: 1px; }
      .subtitle { font: 500 30px 'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .chip { font: 600 21px 'JetBrains Mono', 'PingFang SC', sans-serif; letter-spacing: 0.5px; }
      .nodeTitle { font: 700 26px 'JetBrains Mono', 'PingFang SC', sans-serif; }
      .nodeSub { font: 500 18px 'JetBrains Mono', 'PingFang SC', sans-serif; }
      .tiny { font: 500 16px 'JetBrains Mono', 'PingFang SC', sans-serif; }
    </style>
