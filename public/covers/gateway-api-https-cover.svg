    <text x="92" y="444" class="subtitle" fill="#A7F3D0">证书绑定 / 自动续期 / 云原生入口治理</text>
  </g>

  <g opacity="0.85">
    <rect x="88" y="505" width="360" height="6" rx="3" fill="#38BDF8" fill-opacity="0.28"/>
    <rect x="88" y="505" width="228" height="6" rx="3" fill="#38BDF8"/>
  </g>

  <g opacity="0.92" stroke-linecap="round" stroke-width="4" fill="none">
    <path d="M340 640H470" stroke="#67E8F9" marker-end="url(#arrowCyan)"/>
    <path d="M770 602H855" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
    <path d="M770 706H855" stroke="#34D399" marker-end="url(#arrowGreen)"/>
    <path d="M1125 552H1210" stroke="#A78BFA" marker-end="url(#arrowViolet)"/>
    <path d="M1210 730H1125" stroke="#FBBF24" marker-end="url(#arrowAmber)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="575" width="220" height="130" rx="24" fill="rgba(8,51,68,0.55)"/>
    <rect x="120" y="575" width="220" height="130" rx="24" fill="#083344" fill-opacity="0.45" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="170" y="622" class="nodeTitle" fill="#ECFEFF">Client</text>
    <text x="146" y="663" class="nodeSub" fill="#CFFAFE">Browser / curl / DNS</text>

    <rect x="470" y="535" width="300" height="210" rx="28" fill="#1D4ED8" fill-opacity="0.18" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="560" y="590" class="nodeTitle" fill="#EFF6FF">Gateway</text>
    <text x="520" y="635" class="nodeSub" fill="#DBEAFE">HTTPS Listener: 443</text>
    <text x="535" y="669" class="nodeSub" fill="#DBEAFE">TLS Termination</text>
    <text x="520" y="713" class="tiny" fill="#93C5FD">GatewayClass / LB / Address</text>

    <rect x="855" y="520" width="270" height="120" rx="24" fill="#064E3B" fill-opacity="0.48" stroke="#34D399" stroke-width="2.5"/>
    <text x="932" y="565" class="nodeTitle" fill="#ECFDF5">HTTPRoute</text>
    <text x="904" y="607" class="nodeSub" fill="#D1FAE5">Host / Path Routing</text>

    <rect x="855" y="670" width="270" height="120" rx="24" fill="#065F46" fill-opacity="0.48" stroke="#10B981" stroke-width="2.5"/>
    <text x="915" y="715" class="nodeTitle" fill="#ECFDF5">Service / Pods</text>
    <text x="905" y="757" class="nodeSub" fill="#D1FAE5">web-svc → Deployment</text>

    <rect x="1210" y="470" width="280" height="140" rx="24" fill="#4C1D95" fill-opacity="0.42" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="1270" y="520" class="nodeTitle" fill="#F5F3FF">cert-manager</text>
    <text x="1261" y="563" class="nodeSub" fill="#E9D5FF">Certificate / Secret</text>

